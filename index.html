<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Recommender</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
        }

        h1 { color: #e50914; margin-bottom: 30px; }

        form { text-align: center; margin-bottom: 50px; }

        select {
            padding: 12px;
            width: 350px;
            background: #333;
            color: white;
            border-radius: 5px;
            border: 1px solid #444;
            font-size: 16px;
        }

        button {
            padding: 12px 30px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            font-weight: bold;
        }

        /* Grid for Posters */
        .recommendation-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }

        .movie-card {
            background: #141414;
            width: 200px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            transition: transform 0.3s;
        }

        .movie-card:hover { transform: scale(1.05); }

        .movie-card img {
            width: 100%;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .movie-card p {
            font-size: 14px;
            margin: 5px 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Movie Recommender System</h1>

    <form method="POST">
        <select name="movie_name">
            <option value="" disabled selected>Search for a movie...</option>
            {% for title in movie_list %}
            <option value="{{ title }}">{{ title }}</option>
            {% endfor %}
        </select>
        <button type="submit">Recommend</button>
    </form>

    {% if selected_movie %}
        <h2 style="margin-bottom: 30px;">Top picks for: <span style="color: #e50914;">{{ selected_movie }}</span></h2>
        <div class="recommendation-grid">
            {% for name, poster in recommendations %}
            <div class="movie-card">
                <img src="{{ poster }}" alt="{{ name }}">
                <p>{{ name }}</p>
            </div>
            {% endfor %}
        </div>
    {% endif %}

</body>
</html>
